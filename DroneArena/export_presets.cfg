[preset.0]

name="Web local"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*,web/*,LISEZ-MOI.md"
export_path="../exports/helix-web/index.html"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"description\" content=\"HELIX — Les deux gardiens. Démonstration Web locale, clavier et souris.\"><style>body{background:#080e16}#canvas{outline:none}</style><script>document.addEventListener('contextmenu',e=>e.preventDefault());</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
